<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Collection — gezyy</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/games.css?v=2">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="page-games">

  <main id="games-page">
    <header id="games-header">
      <h1 id="games-title">GAME COLLECTION</h1>
      <p id="games-sub">// archived transmissions from past builds //</p>
    </header>

    <div id="games-layout">
      <nav id="games-sections" aria-label="Collection sections">
        <button class="games-section-tab is-active" type="button" data-section="essays"></button>
        <button class="games-section-tab" type="button" data-section="systems"></button>
        <button class="games-section-tab" type="button" data-section="analysis"></button>
        <button class="games-section-tab" type="button" data-section="devlogs"></button>
      </nav>

      <div id="games-main">
        <section id="games-grid" aria-label="Games grid"></section>

        <div id="games-grid-empty" hidden>
          <span class="blink">// NO ENTRIES //</span>
        </div>

        <div id="games-load-more-wrap" hidden>
          <button id="games-load-more" type="button">[ LOAD MORE ]</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/shared.js"></script>
  <script type="module" src="js/games.js?v=2"></script>
  <script src="admin.js?v=2"></script>
</body>
</html>
