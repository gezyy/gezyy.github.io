<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Detail — gezyy</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/game-detail.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="page-game-detail">

  <article id="game-detail">

    <div id="gd-loading" class="gd-state">
      <span class="blink">// LOADING TRANSMISSION //</span>
    </div>

    <div id="gd-error" class="gd-state" hidden>
      <span>// SIGNAL LOST //</span>
      <p id="gd-error-msg"></p>
      <a class="gd-back-inline" href="games.html">[ ← BACK TO COLLECTION ]</a>
    </div>

    <div id="gd-content" hidden>
      <header id="gd-header">
        <h1 id="gd-title"></h1>
        <ul id="gd-tags" aria-label="Game info tags"></ul>
      </header>

      <section id="gd-video-wrap" aria-label="Preview video"></section>

      <section id="gd-body" aria-label="Project notes"></section>
    </div>
  </article>

  <a id="gd-back-fab" href="games.html" aria-label="Back to Game Collection">
    [ ← GAME COLLECTION ]
  </a>

  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/shared.js"></script>
  <script type="module" src="js/game-detail.js"></script>
  <script src="admin.js"></script>
</body>
</html>
