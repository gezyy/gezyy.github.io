<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gege say hi!</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="page-home">

  <div id="home-hero">
    <h1 id="site-title">Instantiated in a substratum</h1>

    <nav id="home-nav">
      <a class="nav-card" href="library.html">LIBRARY</a>
      <a class="nav-card" href="gallery.html">GALLERY</a>
      <a class="nav-card" href="games.html">GAME COLLECTION</a>
    </nav>
  </div>

  <!-- Geometry sandbox — filled by home.js in M2 -->
  <div id="geo-sandbox" class="interactive"></div>

  <!-- 3D character in bottom-left corner -->
  <model-viewer
    id="home-3d"
    src="assets/gurl.gltf"
    alt="gege 3D character"
    autoplay
    animation-name="idle"
    camera-controls
    disable-zoom
    disable-pan
    interaction-prompt="none"
    shadow-intensity="0"
    exposure="1.1"
    camera-orbit="-90deg 85deg 110%"
    field-of-view="30deg"
  ></model-viewer>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/shared.js"></script>
  <script type="module" src="js/home.js"></script>
  <script src="admin.js?v=2"></script>
</body>
</html>
